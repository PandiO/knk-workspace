  mailrelay:
    # Phase 9 E0 (KNG-211): Postfix relay for the API's mail (invites, password resets) to Gmail SMTP.
    # v5.1.0 pinned by digest. The Gmail app password comes from a file (RELAYHOST_PASSWORD_FILE), never the environment.
    image: boky/postfix:v5.1.0@sha256:aafc772384232497bed875e1eb66b4d3e54ba1ebc86e2e185a6dc1dbc48182ef
    container_name: knk-alpha-mailrelay
    restart: unless-stopped
    environment:
      RELAYHOST: "[smtp.gmail.com]:587"
      RELAYHOST_USERNAME: knightsandkingsmc@gmail.com
      RELAYHOST_PASSWORD_FILE: /run/secrets/gmail_app_password
      # Only the API's From domain, only clients on the mail network; TLS to Gmail is required.
      ALLOWED_SENDER_DOMAINS: gmail.com
      POSTFIX_mynetworks: 172.31.250.16/28
      POSTFIX_smtp_tls_security_level: encrypt
      # The stack has no IPv6; without this Postfix logs a warning per lookup.
      POSTFIX_inet_protocols: ipv4
      TZ: UTC
    volumes:
      - /srv/docker/stacks/knk-alpha/secrets/gmail_app_password:/run/secrets/gmail_app_password:ro
    # mail: the API reaches mailrelay:587; mail-egress: out to smtp.gmail.com. No published ports.
    networks:
      - mail
      - mail-egress
    # Postfix starts as root and drops to its own users; only the capabilities it needs for that.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - KILL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

