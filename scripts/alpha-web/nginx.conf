# app.knightsandkings.net (runbook Phase 6). cloudflared -> web:8080; /api/ -> api:5000 on the internal webapi network.
server {
    listen 8080;
    server_name app.knightsandkings.net;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS with a variable upstream: nginx starts while the API is down and finds a recreated API again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $knk_api http://api:5000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass $knk_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # cloudflared passes the client IP as CF-Connecting-IP; the API trusts X-Forwarded-For only from this network.
        proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $http_connection;
        client_max_body_size 10m;
    }

    location /health/ { deny all; }
    location /static/ { expires 1y; try_files $uri =404; }
    location / { expires -1; try_files $uri /index.html; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}
