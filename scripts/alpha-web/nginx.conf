# app.knightsandkings.net (runbook Phase 6). cloudflared -> web:8080; /api/ -> api:5000 on the internal webapi network.
server {
    listen 8080;
    server_name app.knightsandkings.net;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS with a variable upstream: nginx starts while the API is down and finds a recreated API again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $knk_api http://api:5000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass $knk_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # cloudflared passes the client IP as CF-Connecting-IP; the API trusts X-Forwarded-For only from this network.
        proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $http_connection;
        client_max_body_size 10m;
    }

    # [#181, feature branch claude/realtime-signalr] The web app's SignalR hub: the browser sends its JWT as
    # ?access_token= (a WebSocket can't carry headers), so these requests stay out of the access log. Same proxy
    # settings as /api/, plus a read timeout above the hub's 30 s client timeout. The game server connects to the
    # API directly (api:5000), not through here.
    location /api/hubs/ {
        access_log off;
        proxy_pass $knk_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $http_connection;
        proxy_read_timeout 120s;
    }

    # [#737, overview map] BlueMap's static web app and tiles, rendered by the `bluemap` service into
    # /mnt/fast/knk-alpha/bluemap/web and mounted read-only at /usr/share/nginx/bluemap (runbook Phase 10). Same origin
    # as the app (O26), so the /map page may frame it: X-Frame-Options SAMEORIGIN here only. An add_header in a
    # location drops the server-level ones, so the other two are repeated. Without the mount this answers 404.
    location /bluemap/ {
        root /usr/share/nginx;
        index index.html;
        try_files $uri $uri/ =404;
        expires -1;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;

        # Tiles are gzip files the viewer unpacks itself (webapp.conf client-decompression: true); a tile that was
        # never rendered is an empty 204, as BlueMap's own web server answers.
        location ~ ^/bluemap/maps/[^/]+/tiles/ {
            try_files $uri =204;
            expires 1h;
        }
    }

    location /health/ { deny all; }
    location /static/ { expires 1y; try_files $uri =404; }
    location / { expires -1; try_files $uri /index.html; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}
