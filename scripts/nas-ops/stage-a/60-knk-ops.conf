# knk-ops: forced-command account for Claude Code on the LAN PC (192.168.50.208).
# Every login runs the root-owned dispatcher; no shell, TTY, forwarding or password.
Match User knk-ops
    AuthorizedKeysFile /etc/ssh/knk-ops/authorized_keys
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand /usr/local/libexec/knk-ops/dispatch
    PermitTTY no
    DisableForwarding yes
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
    PermitListen none
    PermitOpen none
    MaxSessions 1
    MaxAuthTries 2
