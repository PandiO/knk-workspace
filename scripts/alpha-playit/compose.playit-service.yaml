  playit:
    # Runbook Phase 5: playit.gg agent, the only way in for Minecraft players (no router port-forward).
    # 1.0.12 pinned by digest. The key comes from a file (--secret-path), never the command line or environment.
    image: ghcr.io/playit-cloud/playit-agent:1.0.12@sha256:5b7748d3e8564f1cac3d3a295a23640136fbf774c76a9509bd262d16b324b06b
    container_name: knk-alpha-playit
    restart: unless-stopped
    user: "2003:2003"
    entrypoint: ["playitd", "--secret-path", "/run/secrets/playit_secret", "--socket-path", "/tmp/playitd.sock", "--platform-docker"]
    environment:
      HOME: /tmp
      TZ: UTC
    volumes:
      - /srv/docker/stacks/knk-alpha/secrets/playit_secret:/run/secrets/playit_secret:ro
    tmpfs:
      - /tmp:size=8m,uid=2003,gid=2003,mode=0700
    read_only: true
    # egress only: internet for the tunnel and minecraft:25565 by service DNS; no route to api or mysql.
    networks:
      - egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

